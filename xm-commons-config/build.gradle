buildscript {

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

}

apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${versions.springBoot}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${versions.springCloud}"
    }
}

dependencies {

    compile project(':xm-commons-logging')
    compile project(':xm-commons-tenant')

    compile "commons-collections:commons-collections:${versions.commonsCollections}"
    compile 'org.springframework.cloud:spring-cloud-commons'
    compile 'org.springframework.cloud:spring-cloud-netflix-core'
    compile('org.springframework.boot:spring-boot-starter-web') {
        exclude module: 'spring-boot-starter-tomcat'
    }
    compile 'org.springframework.kafka:spring-kafka'
    compile 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    compile 'com.fasterxml.jackson.datatype:jackson-datatype-json-org'

    compile "org.apache.commons:commons-lang3:${versions.commonsLang3}"
    compile "org.springframework.security.oauth:spring-security-oauth2:${versions.springSecurityOAuth2}"
    compile "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
    compile "org.bouncycastle:bcprov-jdk15on:${versions.bouncycastle}"

    compileOnly 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    compileOnly 'org.springframework.cloud:spring-cloud-consul-discovery'
    compileOnly 'com.ecwid.consul:consul-api'

    testCompile 'junit:junit'
    testCompile 'org.assertj:assertj-core'
    testCompile 'org.mockito:mockito-core'
    testCompile 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    testCompile 'org.springframework.cloud:spring-cloud-consul-discovery'
    testCompile 'com.ecwid.consul:consul-api'
}

compileJava.dependsOn(processResources)
